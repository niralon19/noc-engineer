[project]
name = "noc-mcp"
version = "0.1.0"
description = "NOC investigation tools for Hermes (MCP server)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",        # official MCP Python SDK (v1 FastMCP or v2 MCPServer both supported)
  "requests>=2.31",
  "pyyaml>=6",
  "uvicorn>=0.30",   # HTTP transport with bearer auth
]

[project.optional-dependencies]
test = ["pytest>=8"]
