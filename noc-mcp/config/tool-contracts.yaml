# Read by OUR noc-mcp startup validation (not Hermes). Tool names are a proposed contract until verified with `hermes mcp test noc_mcp`.
version: 2
mode: discovery_required
server: existing-internal-fastmcp   # Nir's FastMCP server; this repo may only hold the contract
policy:
  default: read_only
  write_requires_approval: true
  reject_unknown_tools: true
  write_tools: [add_investigation_comment, create_followup_task]   # interactive sessions only
domains:
  pipeline:   [get_pipeline_map, get_hop_counts]
  rules:      [get_rule, get_rule_path, get_rule_changes, find_overlapping_rules, validate_rule_change, get_rule_kpis]
  changes:    [get_argo_sync_history, get_deployment_history, get_maintenance_windows, get_server_versions]
  servers:    [get_server_traffic, get_server_drops, get_server_health, compare_servers]
  kafka:      [get_topic_rates, get_consumer_lag, get_consumer_group, get_broker_health]
  monitoring: [query_metrics, query_logs, get_alerts, get_metric_history, compare_baseline]
  platform:   [get_host_health, get_container_status, get_service_status]
  network:    [resolve_dns, lookup_ip, query_ip_ranges, lookup_asn, check_connectivity, inspect_firewall_rules]
  enrichment: [audit_enrichment, validate_asn, validate_provider, validate_ripe_data, get_enrichment_freshness]
  history:    [search_investigations, get_investigation, get_related_incidents]
  jira:       [get_issue, search_issues, add_investigation_comment, create_followup_task, link_issues]
backends: [prometheus, thanos, grafana, eck, kafka, argocd, rancher, openshift, postgres, rules-system, jira]
