# Skeleton. VERIFY image, HERMES_HOME path, gateway command and storage with Nir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hermes-home}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hermes-noc-engineer}
spec:
  replicas: 1                      # exactly one: cron must not run twice and Slack Socket Mode allows one connection per app token
  strategy: {type: Recreate}
  selector: {matchLabels: {app: hermes-noc-engineer}}
  template:
    metadata: {labels: {app: hermes-noc-engineer}}
    spec:
      securityContext: {runAsNonRoot: true}
      initContainers:
        - name: sync-profile
          image: TBD-hermes-image
          command: ["/bin/sh", "/profile-src/profile-init.sh"]
          env: [{name: HERMES_HOME, value: TBD-path}]
          volumeMounts:
            - {name: home, mountPath: TBD-path}
            - {name: profile-src, mountPath: /profile-src}
      containers:
        - name: hermes
          image: TBD-hermes-image
          # Gateway runs Slack (Socket Mode), cron and the API server in one process. VERIFY flags on your version.
          command: ["hermes", "-p", "noc-engineer", "gateway", "run"]
          ports: [{name: api, containerPort: 8642}]
          readinessProbe: {httpGet: {path: /health, port: api}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: api}, initialDelaySeconds: 30, periodSeconds: 20}
          env: [{name: HERMES_HOME, value: TBD-path}]
          envFrom: [{secretRef: {name: hermes-noc-engineer-env}}]   # created outside git
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts: [{name: home, mountPath: TBD-path}]
      volumes:
        - {name: home, persistentVolumeClaim: {claimName: hermes-home}}
        - {name: profile-src, configMap: {name: hermes-profile}}
---
apiVersion: v1
kind: Service
metadata: {name: hermes-noc-engineer}
spec:
  selector: {app: hermes-noc-engineer}
  ports: [{name: api, port: 8642, targetPort: api}]
---
# OpenShift Route (on Rancher use an Ingress). Expose only to the internal network / the web app backend.
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: hermes-noc-engineer}
spec:
  to: {kind: Service, name: hermes-noc-engineer}
  port: {targetPort: api}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
