# Read by OUR Python code (not Hermes).
environment: on-prem
agent: noc-engineer
mcp:
  config_file: ${HERMES_CONFIG_PATH}
  discovery_required: true
  tool_contracts: ../../noc-mcp/config/tool-contracts.yaml
messaging:            # existing org Kafka (no RabbitMQ)
  bootstrap: ${KAFKA_BOOTSTRAP}
  topic_events: TBD-noc-events
  topic_dlq: TBD-noc-events-dlq
storage:
  postgres_dsn: ${HISTORY_DATABASE_URL}   # existing org Postgres, dedicated schema
  retention_days: ${NOC_RETENTION_DAYS}
  timezone: ${NOC_TIMEZONE}
security:
  default_mode: read_only
  require_approval_for_mutations: true
  audit_all_tool_calls: true
