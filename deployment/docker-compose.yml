# LLM/DEVELOPER NOTE: services are OPTIONAL (profile "optional"); not needed for the MVP. Hermes itself is not defined here: ask Nir how Hermes is deployed (official Docker image? existing host?) and verify the HERMES_HOME volume path before adding it.
services:
  postgres:
    profiles: ["optional"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noc_engineer}
      POSTGRES_USER: ${POSTGRES_USER:-noc_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./postgres/schema.sql:/docker-entrypoint-initdb.d/001-memory.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noc_engineer} -d ${POSTGRES_DB:-noc_engineer}"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    profiles: ["optional"]
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-noc_engineer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
volumes:
  postgres_data:
  rabbitmq_data:
