# REQUIRES FROM NIR: B2, B3, C1 (docs/OPEN-QUESTIONS.md). Before implementing/filling run `python3 scripts/open_items.py --file hermes-profile/config.yaml`; if BLOCKED, ask Nir. Never invent.
# Hermes-native config fragment for profile `noc-engineer`.
# Lives at $HERMES_HOME/config.yaml (usually ~/.hermes/profiles/noc-engineer/config.yaml).
# Do NOT overwrite the live file with this one: merge the mcp_servers block with
# `hermes mcp add` or by hand, then `hermes config check`, `hermes mcp test noc_mcp`,
# and `/reload-mcp` in a running session. Secrets go to .env, never here.
# Schema source: https://hermes-agent.nousresearch.com/docs/reference/mcp-config-reference
#
# LLM/DEVELOPER: ask Nir before changing: Hermes version, local LLM endpoint,
# MCP transport (stdio command vs HTTP url) and whether an internal MCP server already exists.
# ---- Model: Kimi K3 through an OpenAI-compatible endpoint (custom provider) ----
# Equivalent: `hermes model` -> Custom endpoint. The key goes to .env (OPENAI_API_KEY), not here.
model:
  provider: custom
  default: kimi-k3                      # VERIFY exact model id served by your endpoint (GET /v1/models)
  base_url: "https://REPLACE-kimi-endpoint/v1"   # VERIFY: internal Kimi K3 endpoint, include /v1
  # context_length: 1048576             # set only if auto-detection is wrong

# ---- Gateway API server: lets the web app / Open WebUI talk to Hermes (OpenAI-compatible, port 8642) ----
# Secrets (API_SERVER_KEY) go to .env. Env vars override these values.
gateway:
  api_server:
    enabled: true
    host: 0.0.0.0                       # inside the pod; exposed only through the k8s Service/Route
    port: 8642
    model_name: noc-engineer            # name the UI shows in its model picker
    max_concurrent_runs: 10

mcp_servers:
  noc_mcp:                      # underscores: Hermes rewrites '-' and '.' in server/tool names
    # Default: noc-mcp runs as its own pod (deployment/k8s/noc-mcp.yaml) so backend credentials stay out of the Hermes pod.
    url: "http://noc-mcp:8765/mcp"      # VERIFY the path your MCP SDK serves (streamable HTTP default is /mcp)
    # Alternative (same host, stdio): Hermes spawns the server itself
    # command: "python"
    # args: ["/app/noc-mcp/server.py"]
    # env: {NOC_MCP_CONFIG: "/config/backends.yaml"}
    enabled: true
    timeout: 120
    connect_timeout: 60
    tools:
      # tools.include is the client-side allowlist (include wins over exclude).
      # Use ORIGINAL MCP tool names (Hermes registers them as mcp_noc_mcp_<tool>).
      include:
        # All implemented in noc-mcp/tools (see `python noc-mcp/server.py --list`). add_investigation_comment is refused unless the server allows writes.
        - get_pipeline_map
        - get_hop_counts
        - get_rule
        - get_rule_path
        - get_rule_changes
        - get_rule_kpis
        - get_argo_sync_history
        - get_deployment_history
        - get_maintenance_windows
        - get_server_drops
        - get_consumer_lag
        - query_metrics
        - query_logs
        - search_investigations
        - search_issues
        - get_issue
        - add_investigation_comment
        - noc_mcp_health
      resources: false
      prompts: false
