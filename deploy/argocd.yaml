apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: hermes-noc, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/niralon19/noc-engineer
    targetRevision: main
    path: deploy
    directory: {include: k8s.yaml}
  destination:
    server: https://kubernetes.default.svc
    namespace: REPLACE-namespace
  syncPolicy: {automated: {prune: true, selfHeal: true}}
